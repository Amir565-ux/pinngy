<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Pinger - 网站状态监控</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

/* Login */
#login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
.login-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
.login-card h1 { font-size: 1.5rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
.login-card .subtitle { color: #94a3b8; font-size: 0.875rem; margin-bottom: 1.5rem; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
.field input { width: 100%; padding: 0.75rem; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 1rem; outline: none; transition: border-color 0.2s; }
.field input:focus { border-color: #3b82f6; }
button { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #6366f1); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.err { color: #ef4444; font-size: 0.875rem; margin-top: 0.5rem; min-height: 1.25rem; }
.hint { color: #64748b; font-size: 0.75rem; margin-top: 1rem; }

/* Dashboard */
#dash-page { display: none; }
header { background: #1e293b; border-bottom: 1px solid #334155; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
header h2 { flex: 1; font-size: 1.1rem; }
.btn { padding: 0.5rem 1rem; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 0.875rem; cursor: pointer; }
.btn:hover { border-color: #3b82f6; }
.main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
.toolbar { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.btn-primary { background: linear-gradient(135deg, #3b82f6, #6366f1); border: none; color: white; padding: 0.625rem 1.25rem; border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.25rem; transition: border-color 0.2s; }
.card:hover { border-color: #3b82f6; }
.card-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
.card-header h3 { flex: 1; font-size: 1rem; }
.badge { padding: 0.25rem 0.625rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
.badge.up { background: #052e16; color: #22c55e; }
.badge.down { background: #450a0a; color: #ef4444; }
.badge.partial { background: #422006; color: #eab308; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.card-url { color: #64748b; font-size: 0.8rem; word-break: break-all; margin-bottom: 0.75rem; }
.stats { display: flex; gap: 1rem; font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.75rem; flex-wrap: wrap; }
.actions { display: flex; gap: 0.5rem; }
.actions button { padding: 0.375rem 0.75rem; font-size: 0.75rem; border-radius: 6px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 440px; }
.modal h2 { margin-bottom: 1rem; }
.modal .field { margin-bottom: 0.875rem; }
.modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }

.toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.875rem; z-index: 200; transform: translateY(120%); transition: transform 0.25s; }
.toast.show { transform: translateY(0); }
.empty { text-align: center; padding: 4rem 1rem; color: #64748b; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-page">
  <div class="login-card">
    <h1>⏺ Website Pinger</h1>
    <p class="subtitle">实时监控网站状态与响应时间</p>
    <div class="field"><label>用户名</label><input id="username" type="text" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password"></div>
    <button id="login-btn">登录</button>
    <div class="err" id="err"></div>
    <p class="hint">默认账号: admin / admin123</p>
  </div>
</div>

<!-- Dashboard -->
<div id="dash-page">
  <header>
    <h2>⏺ Website Pinger</h2>
    <span id="user-info" style="color:#94a3b8;font-size:0.875rem;"></span>
    <button class="btn" onclick="showModal()">+ 添加网站</button>
    <button class="btn" onclick="logout()">退出</button>
  </header>
  <div class="main">
    <div class="toolbar">
      <button class="btn-primary" onclick="pingAll()">↻ 立即检测</button>
      <button class="btn" onclick="loadSites()">⟳ 刷新</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modal-title">添加网站</h2>
    <div class="field"><label>名称</label><input id="m-name" type="text" placeholder="例如: Google"></div>
    <div class="field"><label>网址</label><input id="m-url" type="text" placeholder="https://example.com"></div>
    <div class="field"><label>检测间隔(秒)</label><input id="m-interval" type="number" value="30" min="5"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveSite()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let sites = [];

// Login
document.getElementById('login-btn').onclick = async () => {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  const btn = document.getElementById('login-btn');
  errEl.textContent = ''; btn.disabled = true;
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username,password}) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '登录失败');
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('dash-page').style.display = 'block';
    document.getElementById('user-info').textContent = '你好, ' + username;
    loadSites();
    setInterval(loadSites, 30000);
    toast('登录成功 ✓');
  } catch(e) { errEl.textContent = e.message; }
  finally { btn.disabled = false; }
};
document.getElementById('password').onkeydown = e => { if(e.key==='Enter') document.getElementById('login-btn').click(); };

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  if (r.status===401) { logout(); throw new Error('会话已过期'); }
  return r.json();
}

async function loadSites() {
  try {
    const d = await api('/api/sites');
    sites = d.sites || [];
    render();
  } catch(e) { toast(e.message); }
}

function showModal(id=null) {
  document.getElementById('modal-title').textContent = id ? '编辑网站' : '添加网站';
  if (id) {
    const s = sites.find(x=>x.id===id);
    document.getElementById('m-name').value = s.name;
    document.getElementById('m-url').value = s.url;
    document.getElementById('m-interval').value = Math.round(s.interval_ms/1000);
  } else {
    document.getElementById('m-name').value = '';
    document.getElementById('m-url').value = '';
    document.getElementById('m-interval').value = '30';
  }
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }

async function saveSite() {
  const name = document.getElementById('m-name').value.trim();
  let url = document.getElementById('m-url').value.trim();
  const interval_s = parseInt(document.getElementById('m-interval').value) || 30;
  if (!name || !url) return toast('请填写完整信息');
  if (!url.startsWith('http')) url = 'https://' + url;
  await api('/api/sites', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name,url,interval_ms:interval_s*1000}) });
  closeModal(); loadSites(); toast('已添加');
}

async function deleteSite(id) {
  if (!confirm('确认删除此网站?')) return;
  await api('/api/site/' + id, {method:'DELETE'});
  loadSites(); toast('已删除');
}

async function pingSite(site) {
  const r = await api('/api/ping', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url:site.url, site_id:site.id}) });
  if (r.ok) toast(`${site.name}: ${r.status} ${r.latency}ms`);
  else toast(`${site.name}: DOWN (${r.error||r.status})`);
  loadSites();
}
async function pingAll() {
  toast('正在检测所有网站...');
  await Promise.all(sites.map(s => pingSite(s)));
}

function render() {
  const grid = document.getElementById('grid');
  if (!sites.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><p>暂无网站<br/>点击「+ 添加网站」开始监控</p></div>`;
    return;
  }
  grid.innerHTML = sites.map(s => {
    const st = s.last_status;
    const cls = st === 'up' ? 'up' : st === 'partial' ? 'partial' : 'down';
    const uptime = s.uptime_pct != null ? s.uptime_pct + '%' : '—';
    const latency = s.last_latency != null ? s.last_latency + ' ms' : '—';
    return `<div class="card">
      <div class="card-header"><h3>${esc(s.name)}</h3><span class="badge ${cls}"><span class="dot"></span>${st||'未知'}</span></div>
      <div class="card-url">${esc(s.url)}</div>
      <div class="stats">
        <span>24h 在线率: <b style="color:#e2e8f0">${uptime}</b></span>
        <span>上次延迟: <b style="color:#e2e8f0">${latency}</b></span>
        <span>间隔: <b style="color:#e2e8f0">${Math.round(s.interval_ms/1000)}s</b></span>
      </div>
      <div class="actions">
        <button class="btn" onclick="pingSite(sites.find(x=>x.id===${s.id}))">检测</button>
        <button class="btn" onclick="showModal(${s.id})">编辑</button>
        <button class="btn" style="border-color:#ef4444;color:#ef4444" onclick="deleteSite(${s.id})">删除</button>
      </div>
    </div>`;
  }).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
async function logout() { await fetch('/api/logout',{method:'POST'}); location.reload(); }
</script>
</body>
</html>
